org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Can be music, tracker or lyrics
extType=music
extId=tidal
extClass=TidalExtension

extIconUrl=https://raw.githubusercontent.com/TheWinner02/echo-tidal-extension/master/icon.png
extName=Tidal
extDescription=Tidal extension for Echo with Lossless FLAC playback.

extAuthor=TheWinner02
extAuthorUrl=https://github.com/TheWinner02

extRepoUrl=https://github.com/TheWinner02/echo-tidal-extension
extUpdateUrl=https://api.github.com/repos/TheWinner02/echo-tidal-extension/releases

android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Progressive versioning variables
extVersionCode=1
extVersionName=v1.0.1
