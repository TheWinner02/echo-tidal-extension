org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Can be music, tracker or lyrics
extType=music
extId=echo_flac_bridge
extClass=FlacBridgeExtension

extIconUrl=https://raw.githubusercontent.com/TheWinner02/echo-flac-bridge-extension/master/icon.png
extName=FLAC Bridge Multi
extDescription=Bridge e sorgente FLAC multi-provider (Tidal, Qobuz, Deezer, Amazon Music) con scelta manuale server, verifica sessioni e rinnovo automatico ogni 6 ore.

extAuthor=TheWinner02
extAuthorUrl=https://github.com/TheWinner02

extRepoUrl=https://github.com/TheWinner02/echo-flac-bridge-extension
extUpdateUrl=https://api.github.com/repos/TheWinner02/echo-flac-bridge-extension/releases

android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Progressive versioning variables
extVersionCode=2
extVersionName=v2.3.2
